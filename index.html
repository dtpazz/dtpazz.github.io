<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet David, an investor and Finance and IT professional based in Lincolnshire, UK">
  <meta name="theme-color" content="#f7f5ef">
  <link rel="canonical" href="https://www.syncmail.co.uk/">
  <title>David | Finance &amp; IT</title>
  <style>
    :root {
      --paper: #f7f5ef;
      --ink: #172e26;
      --muted: #45574e;
      --accent: #285442;
      --line: #cbd2c5;
      font-family: system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    main {
      width: min(100% - 2.5rem, 62rem);
      min-height: 100svh;
      margin-inline: auto;
      padding-block: clamp(2.5rem, 10vh, 7rem);
      display: grid;
      align-content: center;
    }

    .location {
      margin: 0 0 1.75rem;
      color: var(--accent);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 400 clamp(3.25rem, 9.5vw, 7.25rem)/1 Georgia, serif;
      letter-spacing: -.055em;
    }

    .intro {
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: clamp(1.125rem, 2.5vw, 1.5rem);
      line-height: 1.55;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: clamp(2rem, 5vw, 3.5rem);
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }

    .contact a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      min-height: 3rem;
      padding: .65rem 1.15rem;
      border: 1px solid var(--accent);
      border-radius: .35rem;
      color: var(--accent);
      font-weight: 650;
      text-decoration: none;
    }

    .contact .primary { color: white; background: var(--accent); }
    .contact a:hover { text-decoration: underline; text-underline-offset: .2em; }
    .contact a:focus-visible { outline: 3px solid #364f95; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="location">Lincolnshire, UK</p>
    <h1>Hi, I’m David.</h1>
    <p class="intro">I’m an investor and Finance and IT professional.</p>
    <nav class="contact" aria-label="Contact David">
      <a class="primary" href="mailto:david@syncmail.co.uk">Email me</a>
      <a href="https://www.linkedin.com/in/david-p-b1067163/">Connect on LinkedIn <span aria-hidden="true">↗</span></a>
    </nav>
  </main>
</body>
</html>
